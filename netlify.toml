[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplicação de página única: qualquer caminho que não seja um arquivo real devolve o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Arquivos em /assets têm hash no nome, então podem ficar em cache por um ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
